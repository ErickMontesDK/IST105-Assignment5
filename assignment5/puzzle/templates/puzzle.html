<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Interactive Treasure Hunt</title>
        <style>
            body { 
                background-color: black;
                color: white;
                padding: 10px 30px;
            }
            .form-group * {
            display: inline;
            }
            form {
                margin-top:15px;
            }
            h1, b {
                font-size: 16px;
                margin: 0px;
            }
            #id_number, #id_text {
                background-color: rgba(255, 255, 255, 0);
                box-sizing: content-box;
                border: none;
                color: yellow;
                width: auto;
                min-width: 30px;
                -moz-appearance: textfield !important;
                appearance: textfield !important;
                -webkit-appearance: none;
                field-sizing: content;
            }
            .input_container {
                color: yellow;
            }
            .input_container::before {
                content: "[";
                margin-left: 5px;
            }
            .input_container::after {
                content: "]";
                margin-left: 2px;
            }
            input[type="submit"] {
                background-color: rgba(255, 255, 255, 0);
                border: none;
                margin-top: 15px;
                padding: 0;
                color: yellow;
                cursor: pointer;
            }
        </style>
</head>
<body>
    <h1>Welcome to the Interactive Treasure Hunt!</h1>
    <b>Enter your details to solve the puzzle and find the treasure.</b>
    
    <!-- form inputs -->
    <form method="POST">
        {% csrf_token %}
        <!--Input for the number, with name "number"-->
        <div class="form-group">
            <label for="{{ form.number.id_for_label }}">Number (e.g., birth year):</label>
            <div class="input_container">
                {{ form.number }}
            </div>
        </div>
        <!--Input for the text, with name "text"-->
        <div class="form-group">
            <label for="{{ form.text.id_for_label }}">Text (e.g., name or secret word):</label>
            <div class="input_container">
                {{ form.text }}
            </div>
        </div>
        

        <input type="submit" value="[Solve the Puzzle]">
        
    </form>


</body>
</html>
